name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ['scripts/build-web.mjs', 'scripts/snapshot.mjs', 'scripts/diff.mjs', 'scripts/notify.mjs', '.github/workflows/web.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Company logo
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          get() { [ -f "$2" ] || curl -fsSL --connect-timeout 15 --max-time 40 --retry 2 -A "$UA" -o "$2" "$1" || true; }
          mkdir -p brand
          get "https://omaralyassirealestate.com/wp-content/plugins/alyassi-dabdaba-plan/assets/logo.png" brand/logo.png
          get "https://omaralyassirealestate.com/wp-content/uploads/2026/07/logo-2.png" brand/emblem.png
          ls -la brand
          test -s brand/logo.png && test -s brand/emblem.png
          pip install --quiet pillow
          python3 scripts/make_resources.py brand/logo.png brand/emblem.png

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#0e1c36' --splashBackgroundColorDark '#0e1c36'
          npx cap sync android

      - name: Version + signing
        env:
          RUN: ${{ github.run_number }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; fi
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $RUN/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$RUN\"/" $G
          echo "$KS_B64" | base64 -d > android/app/release.jks
          cat >> $G <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv('KS_PW')
                      keyAlias 'alyassi'
                      keyPassword System.getenv('KS_PW')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
          }
          EOF

      - name: Build APK + AAB
        working-directory: android
        env:
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/OmarAlYassi-1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/OmarAlYassi-1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: OmarAlYassi-android-1.0.${{ github.run_number }}
          path: out/*

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: نسخة 1.0.${{ github.run_number }}
          body: ملف APK للتثبيت المباشر على أندرويد، وملف AAB للرفع على Google Play.
          files: out/*
