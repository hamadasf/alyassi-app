name: Fetch site plan app (reference)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir ref && cd ref
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          curl -fsSL -A "$UA" -o app.js "https://omaralyassirealestate.com/wp-content/plugins/alyassi-dabdaba-plan/assets/app.js?t=$(date +%s)"
          curl -fsSL -A "$UA" -o plan.html "https://omaralyassirealestate.com/dabdaba-north/?t=$(date +%s)"
          curl -fsSL -A "$UA" -o app.css "https://omaralyassirealestate.com/wp-content/plugins/alyassi-dabdaba-plan/assets/app.css" || true
          ls -la
          git init -q && git checkout -q -b site-ref && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "site reference $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-ref
