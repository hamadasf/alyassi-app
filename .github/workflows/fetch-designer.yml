name: Fetch site designer (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          curl -sSL -A "$UA" "https://omaralyassirealestate.com/dabdaba-north/?pd=oy4ae3dc85d29d" -o plan.html
          curl -sSL -A "$UA" "https://omaralyassirealestate.com/wp-admin/admin-ajax.php?action=dn_pd&pd=oy4ae3dc85d29d" -o pd.html
          grep -oE '(src|href)="[^"]+\.js[^"]*"' plan.html | sed -E 's/^(src|href)="//; s/"$//' | sed 's/&#038;/\&/g' | sort -u > js.txt || true
          i=0; while read -r u; do i=$((i+1)); curl -sSL -A "$UA" "$u" -o "js_$i.js"; echo "$i $u" >> js_index.txt; done < js.txt
          for f in oy-flag.png kamil-base.jpg kamil-icons.png; do curl -sSL -A "$UA" "https://omaralyassirealestate.com/wp-content/plugins/alyassi-dabdaba-plan/assets/ad/$f" -o "$f"; done
          ls -la
      - run: |
          cd out
          git init -q && git checkout -q -b designer-src && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "designer source"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" designer-src
