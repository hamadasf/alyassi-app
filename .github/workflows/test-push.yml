name: Test notification

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'نص الإشعار'
        default: 'تم تفعيل إشعارات عمر الياسي للعقارات ✅ سيصلك إشعار عند أي تغيير في الأسعار أو حالة الأراضي'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send
        env:
          KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          MSG: ${{ inputs.message }}
        run: |
          body=$(jq -n --arg m "$MSG" '{app_id:"9ea9b0f0-c240-495a-8c63-3a2d4a1a11be",target_channel:"push",included_segments:["Total Subscriptions"],headings:{en:"عمر الياسي للعقارات",ar:"عمر الياسي للعقارات"},contents:{en:$m,ar:$m},url:"https://hamadasf.github.io/alyassi-app/#updates"}')
          curl -sS -X POST https://api.onesignal.com/notifications?c=push -H "Content-Type: application/json" -H "Authorization: Key $KEY" -d "$body"
